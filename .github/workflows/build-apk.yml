name: Build APK

# Builds Aub Camera on every push to main, and publishes the APK as the "latest" release,
# so it can be downloaded straight to a phone from the repository's Releases page.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AubCamera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AubCamera-apk
          path: AubCamera.apk

      - name: Publish as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Aub Camera (latest build)
          prerelease: true
          make_latest: true
          files: AubCamera.apk
          body: |
            Latest build of Aub Camera from commit ${{ github.sha }}.
            Download AubCamera.apk on your phone and open it to install.
